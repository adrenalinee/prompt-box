spring.test.constructor.autowire=all
spring.test.constructor.autowire.mode=all
spring.main.allow-bean-definition-overriding=true
app.exception-translation.em.override=true
spring.test.database.replace=NONE
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///mostprompt_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=create-drop
app.security.api-key-encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
spring.liquibase.enabled=false
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocDataRestConfiguration,org.springdoc.core.configuration.SpringDocHateoasConfiguration
