spring.application.name=prompt-box

server.port=7070
server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=on_param

# default profile 은 H2(file) 로 실행. postgresql 은 postgres / dev profile 사용.
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.url=jdbc:h2:file:./h2data/prompt-box;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# changelog 가 postgresql 전용 SQL(DO $$ ... $$) 을 포함하므로 H2 에서는 비활성화하고 hibernate ddl-auto 로 스키마 생성.
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

#spring.threads.virtual.enabled=true

spring.jackson.default-property-inclusion=non_null

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocDataRestConfiguration,org.springdoc.core.configuration.SpringDocHateoasConfiguration

logging.pattern.console=%clr(%date{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:%5level}) %clr([%15.15thread]){faint} %clr(%-50.50logger{49}){yellow} %clr(%class.%method\\(%file:%line\\)){cyan} %clr(:){faint} %message%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}
#logging.level.root=TRACE
logging.level.TRACER_LOG=INFO
#logging.level.okhttp3=TRACE
logging.level.com.openai=TRACE
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.liquibase=trace
