# 로컬 인증: 구글 대신 HMAC JWT 사용. POST /dev/token 으로 토큰 발급. (LocalAuthConfig)
app.security.local-jwt.secret=prompt-box-local-dev-secret-change-me-0123456789
app.security.local-jwt.issuer=prompt-box-local
app.security.local-jwt.ttl=7d

# prompt-box-console 의 next dev 기본 포트(3000) 허용
app.cors.allowed-origins=http://localhost:3000,http://localhost:3030
